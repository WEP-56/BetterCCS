name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发即干跑：完整编译、打包，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 带上事件名：手动干跑也能选 tag，和正式发布同组会把正在跑的发布取消掉
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

# 本仓库发布无需自定义 secrets：不做证书签名、公证或自动更新包；macOS 使用 ad-hoc 签名。
# 因此这里没有 Tauri 更新私钥、也没有 Apple 证书与账号步骤；用户从 Releases 页
# 手动下载安装包覆盖升级（应用内「检查更新」也是打开这一页）。
jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。漏写的话
  # 升级到这一版的用户什么也看不到；结构写坏的话弹窗渲染出错，整个应用落进错误页。
  # 放在最前面查，不白跑编译。推 tag 和 push main 同时发生，不能指望 CI 先跑完单测，
  # 所以这里自己跑一遍检查所有随包摘要的那份单测。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 手动干跑可以在任意分支上跑，那时这一版的摘要可能还没写，只在推 tag 时要求存在
      - name: Validate release version and summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::Missing $file. Write the in-app summary for $TAG (see src/whats-new/README.md); use \"items\": [] to skip the popup."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = process.env.TAG.replace(/^v/, '');
          const json = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const versions = {
            'package.json': json('package.json').version,
            'src-tauri/tauri.conf.json': json('src-tauri/tauri.conf.json').version,
            'src-tauri/Cargo.toml': readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1],
            [`src/whats-new/${expected}.json`]: json(`src/whats-new/${expected}.json`).version,
          };
          for (const [path, version] of Object.entries(versions)) {
            if (version !== expected) {
              throw new Error(`${path}: version ${version} does not match tag ${process.env.TAG}`);
            }
          }
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  release:
    needs: whats-new-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 只发布 MSI（和便携版 exe），不打用不上的 NSIS 安装包
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build --bundles msi
          }

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # e.g., v3.5.0；手动干跑时是分支名，斜杠会被当成目录，换成 -
          $VERSION = $env:GITHUB_REF_NAME -replace '/', '-'
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "BetterCCS-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
          } else {
            throw "No Windows MSI installer found ($env:WINDOWS_RELEASE_ARCH)"
          }

          # 绿色版（portable）：仅可执行文件打 zip
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/betterccs.exe')
          } else {
            @(
              'src-tauri/target/release/betterccs.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/betterccs.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/BetterCCS-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# BetterCCS portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# BetterCCS portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/BetterCCS-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: BetterCCS-$VERSION-Windows$assetSuffix-Portable.zip"
          } else {
            throw "Portable exe not found ($env:WINDOWS_RELEASE_ARCH)"
          }

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

  # macOS 两个架构分两台机器同时编译（以前在一台机器上串行），再由 macos-release 合并打包。
  macos-binary:
    name: Build macOS binary (${{ matrix.target }})
    needs: whats-new-check
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 编译只做一次：编译失败是确定性的，重试没有意义。
      - name: Build Tauri App (${{ matrix.target }})
        timeout-minutes: 60
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: macos-binary-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/betterccs
          if-no-files-found: error
          retention-days: 1

  # 合并成 universal 二进制后打包成 zip / dmg。不做签名与公证（不需要 Apple 账号与证书）：
  # macOS 会提示"无法验证开发者"，用户右键打开或在「隐私与安全性」里允许即可。
  macos-release:
    name: Bundle macOS release
    runs-on: macos-14
    needs: macos-binary

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: macos-binary-*
          path: macos-binaries

      # tauri bundle 只读这个 universal 二进制（和 tauri build --target universal-apple-darwin
      # 的 lipo 结果相同），不需要各架构的 target 目录。
      - name: Merge universal binary
        shell: bash
        run: |
          set -euo pipefail
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/betterccs" \
            macos-binaries/macos-binary-aarch64-apple-darwin/betterccs \
            macos-binaries/macos-binary-x86_64-apple-darwin/betterccs
          chmod +x "$out/betterccs"
          lipo -info "$out/betterccs"

      # 只打 .app；发布用的 DMG 在下面由 create-dmg 制作（Tauri 自己的 DMG 从来不上传）。
      # `APPLE_SIGNING_IDENTITY=-` 是 ad-hoc 签名：没有证书也能让包在本机可用。
      - name: Bundle (macOS, ad-hoc signed)
        shell: bash
        timeout-minutes: 45
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri bundle --target universal-apple-darwin --bundles app

      - name: Prepare macOS Assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # e.g., v3.5.0；手动干跑时是分支名，斜杠会被当成目录，换成 -
          VERSION="${GITHUB_REF_NAME//\//-}"

          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # 1) Collect .app as zip（解压即用）
          NEW_ZIP="BetterCCS-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 2) Create styled DMG with create-dmg（不做签名：没有证书）
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="BetterCCS-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/BetterCCS.app"

          create-dmg \
            --volname "BetterCCS" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "BetterCCS.app" 180 220 \
            --hide-extension "BetterCCS.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-macOS
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [release, macos-release]
    # 只有推 tag 才发布。手动触发时也能选 tag 作为运行版本，单看 ref_type 会把干跑当成正式发布，
    # 覆盖已发布 release 的正文和安装包
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for suffix in Windows.msi Windows-Portable.zip Windows-arm64.msi Windows-arm64-Portable.zip macOS.dmg macOS.zip; do
            file="release-assets/BetterCCS-${TAG}-${suffix}"
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty release asset: $file"
              exit 1
            fi
          done
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: BetterCCS ${{ github.ref_name }}
          prerelease: false
          body: |
            ## BetterCCS ${{ github.ref_name }}

            Claude Code / Codex / Gemini CLI 供应商切换工具。

            ### 更新

            - 品牌改为 BetterCCS，界面保留简体中文与英文。
            - 更新检查与发行说明使用本仓库，升级从 Releases 下载安装包。
            - Windows 与 macOS 构建无需配置自定义 secrets。

            ### 下载

            - **Windows (x86_64)**: `BetterCCS-${{ github.ref_name }}-Windows.msi`（安装版）或 `BetterCCS-${{ github.ref_name }}-Windows-Portable.zip`（绿色版）
            - **Windows (ARM64)**: `BetterCCS-${{ github.ref_name }}-Windows-arm64.msi`（安装版）或 `BetterCCS-${{ github.ref_name }}-Windows-arm64-Portable.zip`（绿色版）
            - **macOS (Intel / Apple 芯片通用)**: `BetterCCS-${{ github.ref_name }}-macOS.dmg`（推荐）或 `BetterCCS-${{ github.ref_name }}-macOS.zip`（解压即用）

            > 安装包未做代码签名：Windows 首次运行可能有 SmartScreen 提示（「更多信息 → 仍要运行」），
            > macOS 需右键「打开」或在「隐私与安全性」里允许。
          files: release-assets/*
          fail_on_unmatched_files: true
